name: Submit an example
description: Contribute a biomarker example without opening a pull request. A maintainer will add it for you.
title: "Example: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for contributing. Please make sure the example contains no
        patient-identifiable data before you paste it here — this issue is
        public, and it stays public even if the issue is closed.

  - type: input
    id: title
    attributes:
      label: Title
      description: A short name for the example, e.g. "PSA result from our LIS".
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: Origin
      options:
        - real-world
        - derived-from-real
        - synthetic
    validations:
      required: true

  - type: textarea
    id: resource
    attributes:
      label: The example
      description: One or more FHIR resources as JSON or XML.
      render: json
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Which biomarker, which system produced it, and anything a reader should
        know about the way it is modelled.
    validations:
      required: true

  - type: input
    id: custodian
    attributes:
      label: Who can answer questions about this example?
      description: A name, and optionally a GitHub login or a contact address.

  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: The example contains no patient-identifiable data.
          required: true
        - label: I may publish this example, and I contribute it under the Apache 2.0 licence.
          required: true
